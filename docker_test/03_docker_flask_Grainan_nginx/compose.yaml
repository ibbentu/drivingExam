services:
  web:
    build: .
    container_name: flask_granian_web
    volumes:
      - .:/app
    expose:
      - "5000"
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_front
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web